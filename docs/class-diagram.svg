<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme de classes du projet de gestion de bibliotheque</title>
  <desc id="desc">Diagramme montrant les classes People, User, Admin, Element, Book, Magazine, Borrow, Role et BorrowStatus avec leurs associations et heritages.</desc>
  <defs>
    <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#fff" stroke="#27313a" stroke-width="1.4"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#27313a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .class { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; rx: 8; }
      .head { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; }
      .enum .head { fill: #fee2e2; }
      .abstract { font-style: italic; }
      .title { font: 700 16px Arial, sans-serif; fill: #111827; }
      .text { font: 14px Arial, sans-serif; fill: #1f2937; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .line { stroke: #27313a; stroke-width: 1.5; fill: none; }
      .note { fill: #fffbeb; stroke: #a16207; stroke-width: 1.1; rx: 6; }
      .badge { fill: #bbf7d0; stroke: #166534; stroke-width: 1; }
      .badge-enum { fill: #fecaca; stroke: #991b1b; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="830"/>

  <g transform="translate(705 24)">
    <rect class="class" width="190" height="180"/>
    <rect class="head" width="190" height="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="small" x="16" y="23">A</text>
    <text class="title abstract" x="45" y="23">People</text>
    <text class="text" x="14" y="58">- id : Long</text>
    <text class="text" x="14" y="80">- nom : String</text>
    <text class="text" x="14" y="102">- prenom : String</text>
    <text class="text" x="14" y="124">- email : String</text>
    <text class="text" x="14" y="146">- password : String</text>
    <line x1="0" y1="156" x2="190" y2="156" stroke="#64748b"/>
    <text class="text" x="14" y="176">+ getRole() : Role</text>
  </g>

  <g transform="translate(902 76)">
    <rect class="note" width="196" height="58"/>
    <text class="small" x="10" y="20">Inheritance strategy:</text>
    <text class="small" x="10" y="38">JOINED</text>
    <text class="small" x="10" y="54">Discriminator column: role</text>
  </g>
  <line class="line" x1="902" y1="102" x2="895" y2="102"/>

  <g transform="translate(505 220)">
    <rect class="class" width="210" height="118"/>
    <rect class="head" width="210" height="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="small" x="16" y="23">C</text>
    <text class="title" x="45" y="23">User</text>
    <text class="text" x="14" y="60">- adresse : String</text>
    <text class="text" x="14" y="82">- maxBookings : Integer</text>
    <text class="text" x="14" y="104">- dureeBooking : Integer</text>
  </g>

  <g transform="translate(760 240)">
    <rect class="class" width="108" height="74"/>
    <rect class="head" width="108" height="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="small" x="16" y="23">C</text>
    <text class="title" x="45" y="23">Admin</text>
  </g>

  <g transform="translate(930 230)" class="enum">
    <rect class="class" width="98" height="104"/>
    <rect class="head" width="98" height="36"/>
    <circle class="badge-enum" cx="20" cy="18" r="11"/>
    <text class="small" x="16" y="23">E</text>
    <text class="title" x="45" y="23">Role</text>
    <text class="text" x="14" y="62">ADMIN</text>
    <text class="text" x="14" y="84">USER</text>
  </g>

  <g transform="translate(160 395)">
    <rect class="class" width="170" height="112"/>
    <rect class="head" width="170" height="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="small" x="16" y="23">C</text>
    <text class="title" x="45" y="23">Element</text>
    <text class="text" x="14" y="60">- id : Long</text>
    <text class="text" x="14" y="82">- media : String</text>
    <text class="text" x="14" y="104">- title : String</text>
  </g>

  <g transform="translate(350 430)">
    <rect class="note" width="178" height="50"/>
    <text class="small" x="10" y="20">Inheritance strategy:</text>
    <text class="small" x="10" y="38">SINGLE_TABLE</text>
  </g>
  <line class="line" x1="350" y1="454" x2="330" y2="454"/>

  <g transform="translate(18 605)">
    <rect class="class" width="130" height="70"/>
    <rect class="head" width="130" height="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="small" x="16" y="23">C</text>
    <text class="title" x="45" y="23">Book</text>
    <text class="text" x="14" y="60">- author : String</text>
  </g>

  <g transform="translate(188 605)">
    <rect class="class" width="235" height="70"/>
    <rect class="head" width="235" height="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="small" x="16" y="23">C</text>
    <text class="title" x="45" y="23">Magazine</text>
    <text class="text" x="14" y="60">- datePublication : LocalDate</text>
  </g>

  <g transform="translate(505 545)">
    <rect class="class" width="220" height="136"/>
    <rect class="head" width="220" height="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="small" x="16" y="23">C</text>
    <text class="title" x="45" y="23">Borrow</text>
    <text class="text" x="14" y="60">- id : Long</text>
    <text class="text" x="14" y="82">- borrowDate : LocalDate</text>
    <text class="text" x="14" y="104">- dueDate : LocalDate</text>
    <text class="text" x="14" y="126">- returnDate : LocalDate</text>
    <text class="text" x="14" y="148">- status : BorrowStatus</text>
  </g>

  <g transform="translate(535 704)" class="enum">
    <rect class="class" width="150" height="104"/>
    <rect class="head" width="150" height="36"/>
    <circle class="badge-enum" cx="20" cy="18" r="11"/>
    <text class="small" x="16" y="23">E</text>
    <text class="title" x="45" y="23">BorrowStatus</text>
    <text class="text" x="14" y="62">IN_PROGRESS</text>
    <text class="text" x="14" y="80">BORROWED</text>
    <text class="text" x="14" y="98">RETURNED</text>
  </g>

  <line class="line" x1="650" y1="220" x2="745" y2="180" marker-end="url(#inherit)"/>
  <line class="line" x1="814" y1="240" x2="800" y2="180" marker-end="url(#inherit)"/>
  <line class="line" x1="952" y1="230" x2="838" y2="180" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text class="small" x="876" y="210">getRole()</text>

  <line class="line" x1="84" y1="605" x2="190" y2="507" marker-end="url(#inherit)"/>
  <line class="line" x1="282" y1="605" x2="250" y2="507" marker-end="url(#inherit)"/>

  <line class="line" x1="330" y1="438" x2="505" y2="338"/>
  <text class="small" x="438" y="358">wishlist / wishedBy</text>
  <text class="small" x="338" y="420">0..*</text>
  <text class="small" x="472" y="374">0..*</text>

  <line class="line" x1="715" y1="315" x2="650" y2="545"/>
  <text class="small" x="708" y="452">user</text>
  <text class="small" x="696" y="360">1</text>
  <text class="small" x="650" y="532">0..*</text>

  <line class="line" x1="330" y1="500" x2="505" y2="575"/>
  <text class="small" x="430" y="548">item</text>
  <text class="small" x="340" y="520">1</text>
  <text class="small" x="475" y="565">0..*</text>

  <line class="line" x1="615" y1="681" x2="615" y2="704" marker-end="url(#arrow)"/>
  <text class="small" x="625" y="699">status</text>
</svg>
